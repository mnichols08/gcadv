[package]
name = "adventure-analysis"
version = "0.1.0"
edition = "2021"
license = "ISC"
description = "Local segmented GPX distance and elevation analysis"
repository = "https://github.com/mnichols08/chingu-mapbox"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
roxmltree = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
